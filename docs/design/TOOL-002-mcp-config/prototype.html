<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>TEAM-001 团队协作复用 AgentScope teams（浅映射）— RabbitWork 高保真原型</title>
    <title>TOOL-002 MCP 服务器配置 — RabbitWork 高保真原型</title>
    <style>
      /* =========================================================
         RabbitWork DS v2.1 tokens（与 apps/web/src/app/theme/tokens.css 同源）
         ========================================================= */
      :root {
        --rw-bg: #fafafa;
        --rw-card: #ffffff;
        --rw-fg: #0f172a;
        --rw-fg-muted: #64748b;
        --rw-fg-subtle: #94a3b8;
        --rw-border: #e4e8ee;
        --rw-border-strong: #cbd5e1;
        --rw-accent: #10b981;
        --rw-accent-hover: #059669;
        --rw-accent-fg: #ffffff;
        --rw-accent-subtle: #ecfdf5;
        --rw-success: #10b981;
        --rw-success-subtle: #ecfdf5;
        --rw-warning: #d97706;
        --rw-warning-subtle: #fef3e2;
        --rw-danger: #dc2626;
        --rw-danger-subtle: #fdecec;
        --rw-muted-subtle: #f1f5f9;
        --rw-ring: rgba(16, 185, 129, 0.45);
        --rw-shadow-float: 0 8px 24px rgba(15, 23, 42, 0.12);
        --font-display: "Space Grotesk", "PingFang SC", "HarmonyOS Sans SC", "Microsoft YaHei", sans-serif;
        --font-body: "DM Sans", "PingFang SC", "HarmonyOS Sans SC", "Microsoft YaHei", sans-serif;
        --font-mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
        --radius-sm: 4px;
        --radius-md: 8px;
        --radius-lg: 12px;
        --t-fast: 140ms;
        --t-base: 200ms;
        --ease-out: cubic-bezier(0.25, 0.46, 0.45, 0.94);
      }
      .dark {
        --rw-bg: #0b0f1a;
        --rw-card: #111827;
        --rw-fg: #f1f5f9;
        --rw-fg-muted: #94a3b8;
        --rw-fg-subtle: #5b6b82;
        --rw-border: #1e293b;
        --rw-border-strong: #334155;
        --rw-accent: #34d399;
        --rw-accent-hover: #6ee7b7;
        --rw-accent-fg: #052e21;
        --rw-accent-subtle: rgba(52, 211, 153, 0.12);
        --rw-success: #34d399;
        --rw-success-subtle: rgba(52, 211, 153, 0.12);
        --rw-warning: #f59e0b;
        --rw-warning-subtle: rgba(245, 158, 11, 0.14);
        --rw-danger: #f87171;
        --rw-danger-subtle: rgba(248, 113, 113, 0.12);
        --rw-muted-subtle: rgba(148, 163, 184, 0.1);
        --rw-ring: rgba(52, 211, 153, 0.5);
        --rw-shadow-float: 0 8px 24px rgba(0, 0, 0, 0.5);
      }
      html { font-size: 16px; }
      body {
        background: var(--rw-bg);
        color: var(--rw-fg);
        font-family: var(--font-body);
        line-height: 1.6;
        transition: background 200ms var(--ease-out), color 200ms var(--ease-out);
      }
      .font-display { font-family: var(--font-display); letter-spacing: -0.015em; }
      .font-mono { font-family: var(--font-mono); }
      .num { font-variant-numeric: tabular-nums; }
      .rw-card { background: var(--rw-card); border: 1px solid var(--rw-border); border-radius: var(--radius-md); }
      .rw-hover { transition: transform 200ms var(--ease-out), border-color 200ms var(--ease-out), box-shadow 200ms var(--ease-out); }
      .rw-hover:hover { transform: translateY(-3px); border-color: var(--rw-border-strong); box-shadow: var(--rw-shadow-float); }
      .btn-primary {
        background: var(--rw-accent); color: var(--rw-accent-fg); border-radius: var(--radius-sm);
        padding: 0 16px; height: 32px; font-size: 14px; font-weight: 500;
        transition: all 140ms var(--ease-out); display: inline-flex; align-items: center; gap: 6px;
      }
      .btn-primary:hover { background: var(--rw-accent-hover); box-shadow: 0 0 0 4px var(--rw-ring); }
      .btn-primary:active { transform: scale(0.96); }
      .btn-default {
        background: var(--rw-card); color: var(--rw-fg); border: 1px solid var(--rw-border-strong);
        border-radius: var(--radius-sm); padding: 0 16px; height: 32px; font-size: 14px;
        transition: all 140ms var(--ease-out); display: inline-flex; align-items: center; gap: 6px;
      }
      .btn-default:hover { border-color: var(--rw-accent); color: var(--rw-accent); }
      .btn-text { color: var(--rw-fg-muted); border-radius: var(--radius-sm); padding: 4px 8px; font-size: 14px; transition: all 140ms var(--ease-out); }
      .btn-text:hover { background: var(--rw-muted-subtle); color: var(--rw-fg); }
      .pill {
        display: inline-flex; align-items: center; gap: 6px; border-radius: 999px;
        padding: 2px 10px; font-size: 12px; font-weight: 500; line-height: 20px;
      }
      .pill-dot { width: 6px; height: 6px; border-radius: 50%; }
      .pill-success { background: var(--rw-success-subtle); color: var(--rw-success); }
      .pill-success .pill-dot { background: var(--rw-success); animation: breathe 2.4s ease-in-out infinite; }
      .pill-warning { background: var(--rw-warning-subtle); color: var(--rw-warning); }
      .pill-warning .pill-dot { background: var(--rw-warning); }
      .pill-muted { background: var(--rw-muted-subtle); color: var(--rw-fg-muted); }
      .pill-muted .pill-dot { background: var(--rw-fg-subtle); }
      .pill-danger { background: var(--rw-danger-subtle); color: var(--rw-danger); }
      .pill-danger .pill-dot { background: var(--rw-danger); }
      @keyframes breathe { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }
      .tab {
        padding: 8px 4px; margin-right: 24px; font-size: 14px; color: var(--rw-fg-muted);
        border-bottom: 2px solid transparent; transition: all 140ms var(--ease-out); cursor: pointer;
      }
      .tab:hover { color: var(--rw-fg); }
      .tab.active { color: var(--rw-accent); border-bottom-color: var(--rw-accent); font-weight: 500; }
      .tab .num { margin-left: 4px; color: var(--rw-fg-subtle); font-size: 12px; }
      .modal-mask { background: rgba(15, 23, 42, 0.45); }
      .modal {
        background: var(--rw-card); border-radius: var(--radius-lg); box-shadow: var(--rw-shadow-float);
        border: 1px solid var(--rw-border);
      }
      .input {
        background: var(--rw-card); border: 1px solid var(--rw-border-strong); border-radius: var(--radius-sm);
        height: 32px; padding: 0 12px; font-size: 14px; color: var(--rw-fg); width: 100%;
        transition: all 140ms var(--ease-out); outline: none;
      }
      .input:focus { border-color: var(--rw-accent); box-shadow: 0 0 0 3px var(--rw-ring); }
      .avatar {
        width: 38px; height: 38px; border-radius: var(--radius-sm); background: var(--rw-accent-subtle);
        color: var(--rw-accent); display: flex; align-items: center; justify-content: center;
        font-size: 14px; font-weight: 500; flex-shrink: 0;
      }
    <main class="mx-auto max-w-[1080px] px-8 py-8 space-y-10">

      <section>
        <div class="mb-4 flex items-center gap-3"><span class="section-tag">A</span>
          <h2 class="font-display text-[15px] font-semibold">MCP 服务列表（/mcp 新导航「MCP 服务」）：transport pill + endpoint + 测试入口</h2></div>
        <div class="mb-4 flex items-end justify-between">
          <div><h3 class="font-display text-2xl font-semibold tracking-tight text-rw-fg">工具</h3>
            <p class="mt-1 text-sm text-rw-fg-subtle">HTTP 工具定义——测试验证后绑定给数字员工使用</p></div>
          <button class="btn-primary" data-testid="tool-create-btn">＋ 新建工具</button>
        </div>
        <div class="overflow-hidden rounded-[8px] border" style="border-color: var(--rw-border)">
          <table class="w-full text-sm">
            <thead><tr class="text-left text-xs" style="background: var(--rw-muted-subtle); color: var(--rw-fg-muted)">
              <th class="px-4 py-2.5 font-medium">方法</th><th class="px-4 py-2.5 font-medium">名称 / URL</th>
              <th class="px-4 py-2.5 font-medium">状态</th><th class="px-4 py-2.5 font-medium text-right">操作</th></tr></thead>
            <tbody>
              <tr class="row-hover"><td class="px-4 py-2.5"><span class="pill pill-success" style="animation:none"><span class="pill-dot" style="animation:none"></span>streamable_http</span></td>
                <td class="px-4 py-2.5">文档知识 MCP<br /><span class="font-mono text-xs text-rw-fg-subtle">https://mcp.internal.example.com/sse</span></td>
                <td class="px-4 py-2.5"><span class="pill pill-success" style="animation:none"><span class="pill-dot" style="animation:none"></span>ACTIVE</span></td>
                <td class="px-4 py-2.5 text-right"><button class="btn-text">测试</button> <button class="btn-text">编辑</button></td></tr>
              <tr class="row-hover" style="border-top:1px solid var(--rw-border)"><td class="px-4 py-2.5"><span class="pill pill-warning"><span class="pill-dot"></span>sse</span></td>
                <td class="px-4 py-2.5">内部工具 MCP<br /><span class="font-mono text-xs text-rw-fg-subtle">https://mcp.tools.example.com/mcp</span></td>
                <td class="px-4 py-2.5"><span class="pill pill-muted"><span class="pill-dot"></span>ACTIVE</span></td>
                <td class="px-4 py-2.5 text-right"><button class="btn-text">测试</button> <button class="btn-text">编辑</button></td></tr>
            </tbody>
          </table>
        </div>
      </section>

      <section>
        <div class="mb-4 flex items-center gap-3"><span class="section-tag">B</span>
          <h2 class="font-display text-[15px] font-semibold">编辑弹窗：方法/URL/请求头（敏感值掩码）</h2></div>
        <div class="rw-card p-6 space-y-4">
          <div class="grid grid-cols-3 gap-4">
            <div><label class="mb-1.5 block text-xs text-rw-fg-muted">名称</label><input class="input" value="文档知识 MCP" /></div>
            <div><label class="mb-1.5 block text-xs text-rw-fg-muted">方法</label>
              <select class="input"><option selected>GET</option><option>POST</option><option>PUT</option><option>DELETE</option></select></div>
            <div><label class="mb-1.5 block text-xs text-rw-fg-muted">超时</label><input class="input" value="10s" disabled /></div>
          </div>
          <div><label class="mb-1.5 block text-xs text-rw-fg-muted">URL（支持 {{参数}} 占位）</label><input class="input font-mono text-[13px]" value="https://mcp.internal.example.com/sse" /></div>
          <div><label class="mb-1.5 block text-xs text-rw-fg-muted">请求头</label>
            <div class="grid grid-cols-2 gap-2">
              <input class="input" value="Authorization" /><input class="input" value="••••••••（已加密,编辑才明文）" />
            </div></div>
          <p class="text-xs text-rw-fg-subtle">含 authorization/token/apikey/secret 关键字的头值 AES-GCM 加密落库,接口永不回显明文（rules/security §4.2）。</p>
        </div>
      </section>

      <section>
        <div class="mb-4 flex items-center gap-3"><span class="section-tag">C</span>
          <h2 class="font-display text-[15px] font-semibold">测试面板：左入参右响应（真实调用,SSRF 守卫）</h2></div>
        <div class="rw-card p-6">
          <div class="grid grid-cols-2 gap-6">
            <div>
              <label class="mb-1.5 block text-xs text-rw-fg-muted">入参（渲染 {{占位}}）</label>
              <textarea class="input !h-auto p-3 font-mono text-[13px]" rows="4">{ "币种": "USD" }</textarea>
              <button class="btn-primary mt-3" data-testid="tool-testrun-btn">▶ 测试</button>
              <p class="mt-2 text-xs text-rw-fg-subtle">经平台出站守卫（私网默认拒绝,白名单 env 可放行）</p>
            </div>
            <div>
              <div class="mb-1.5 flex items-center justify-between">
                <label class="text-xs text-rw-fg-muted">响应</label>
                <span class="text-xs tabular-nums text-rw-fg-subtle">200 · 342ms · 1.2KB</span>
              </div>
              <pre class="rounded-[8px] border p-3 font-mono text-xs leading-relaxed" style="border-color: var(--rw-border); background: var(--rw-muted-subtle); color: var(--rw-fg)">{ "base": "USD", "rates": { "CNY": 7.16 } }</pre>
              <p class="mt-2 rounded-[8px] px-3 py-2 font-mono text-xs" style="background: var(--rw-danger-subtle); color: var(--rw-danger)" data-testid="tool-ssrf-reject">192.168.1.10 为私网地址,已被出站守卫拒绝（TOOL_SSRF_ALLOWLIST 可配置放行）</p>
            </div>
          </div>
        </div>
      </section>

    </main>
  </body>
</html>
