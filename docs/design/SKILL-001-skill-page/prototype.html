<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>TEAM-001 团队协作复用 AgentScope teams（浅映射）— RabbitWork 高保真原型</title>
    <title>SKILL-001 技能管理页 — RabbitWork 高保真原型</title>
    <style>
      /* =========================================================
         RabbitWork DS v2.1 tokens（与 apps/web/src/app/theme/tokens.css 同源）
         ========================================================= */
      :root {
        --rw-bg: #fafafa;
        --rw-card: #ffffff;
        --rw-fg: #0f172a;
        --rw-fg-muted: #64748b;
        --rw-fg-subtle: #94a3b8;
        --rw-border: #e4e8ee;
        --rw-border-strong: #cbd5e1;
        --rw-accent: #10b981;
        --rw-accent-hover: #059669;
        --rw-accent-fg: #ffffff;
        --rw-accent-subtle: #ecfdf5;
        --rw-success: #10b981;
        --rw-success-subtle: #ecfdf5;
        --rw-warning: #d97706;
        --rw-warning-subtle: #fef3e2;
        --rw-danger: #dc2626;
        --rw-danger-subtle: #fdecec;
        --rw-muted-subtle: #f1f5f9;
        --rw-ring: rgba(16, 185, 129, 0.45);
        --rw-shadow-float: 0 8px 24px rgba(15, 23, 42, 0.12);
        --font-display: "Space Grotesk", "PingFang SC", "HarmonyOS Sans SC", "Microsoft YaHei", sans-serif;
        --font-body: "DM Sans", "PingFang SC", "HarmonyOS Sans SC", "Microsoft YaHei", sans-serif;
        --font-mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
        --radius-sm: 4px;
        --radius-md: 8px;
        --radius-lg: 12px;
        --t-fast: 140ms;
        --t-base: 200ms;
        --ease-out: cubic-bezier(0.25, 0.46, 0.45, 0.94);
      }
      .dark {
        --rw-bg: #0b0f1a;
        --rw-card: #111827;
        --rw-fg: #f1f5f9;
        --rw-fg-muted: #94a3b8;
        --rw-fg-subtle: #5b6b82;
        --rw-border: #1e293b;
        --rw-border-strong: #334155;
        --rw-accent: #34d399;
        --rw-accent-hover: #6ee7b7;
        --rw-accent-fg: #052e21;
        --rw-accent-subtle: rgba(52, 211, 153, 0.12);
        --rw-success: #34d399;
        --rw-success-subtle: rgba(52, 211, 153, 0.12);
        --rw-warning: #f59e0b;
        --rw-warning-subtle: rgba(245, 158, 11, 0.14);
        --rw-danger: #f87171;
        --rw-danger-subtle: rgba(248, 113, 113, 0.12);
        --rw-muted-subtle: rgba(148, 163, 184, 0.1);
        --rw-ring: rgba(52, 211, 153, 0.5);
        --rw-shadow-float: 0 8px 24px rgba(0, 0, 0, 0.5);
      }
      html { font-size: 16px; }
      body {
        background: var(--rw-bg);
        color: var(--rw-fg);
        font-family: var(--font-body);
        line-height: 1.6;
        transition: background 200ms var(--ease-out), color 200ms var(--ease-out);
      }
      .font-display { font-family: var(--font-display); letter-spacing: -0.015em; }
      .font-mono { font-family: var(--font-mono); }
      .num { font-variant-numeric: tabular-nums; }
      .rw-card { background: var(--rw-card); border: 1px solid var(--rw-border); border-radius: var(--radius-md); }
      .rw-hover { transition: transform 200ms var(--ease-out), border-color 200ms var(--ease-out), box-shadow 200ms var(--ease-out); }
      .rw-hover:hover { transform: translateY(-3px); border-color: var(--rw-border-strong); box-shadow: var(--rw-shadow-float); }
      .btn-primary {
        background: var(--rw-accent); color: var(--rw-accent-fg); border-radius: var(--radius-sm);
        padding: 0 16px; height: 32px; font-size: 14px; font-weight: 500;
        transition: all 140ms var(--ease-out); display: inline-flex; align-items: center; gap: 6px;
      }
      .btn-primary:hover { background: var(--rw-accent-hover); box-shadow: 0 0 0 4px var(--rw-ring); }
      .btn-primary:active { transform: scale(0.96); }
      .btn-default {
        background: var(--rw-card); color: var(--rw-fg); border: 1px solid var(--rw-border-strong);
        border-radius: var(--radius-sm); padding: 0 16px; height: 32px; font-size: 14px;
        transition: all 140ms var(--ease-out); display: inline-flex; align-items: center; gap: 6px;
      }
      .btn-default:hover { border-color: var(--rw-accent); color: var(--rw-accent); }
      .btn-text { color: var(--rw-fg-muted); border-radius: var(--radius-sm); padding: 4px 8px; font-size: 14px; transition: all 140ms var(--ease-out); }
      .btn-text:hover { background: var(--rw-muted-subtle); color: var(--rw-fg); }
      .pill {
        display: inline-flex; align-items: center; gap: 6px; border-radius: 999px;
        padding: 2px 10px; font-size: 12px; font-weight: 500; line-height: 20px;
      }
      .pill-dot { width: 6px; height: 6px; border-radius: 50%; }
      .pill-success { background: var(--rw-success-subtle); color: var(--rw-success); }
      .pill-success .pill-dot { background: var(--rw-success); animation: breathe 2.4s ease-in-out infinite; }
      .pill-warning { background: var(--rw-warning-subtle); color: var(--rw-warning); }
      .pill-warning .pill-dot { background: var(--rw-warning); }
      .pill-muted { background: var(--rw-muted-subtle); color: var(--rw-fg-muted); }
      .pill-muted .pill-dot { background: var(--rw-fg-subtle); }
      .pill-danger { background: var(--rw-danger-subtle); color: var(--rw-danger); }
      .pill-danger .pill-dot { background: var(--rw-danger); }
      @keyframes breathe { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }
      .tab {
        padding: 8px 4px; margin-right: 24px; font-size: 14px; color: var(--rw-fg-muted);
        border-bottom: 2px solid transparent; transition: all 140ms var(--ease-out); cursor: pointer;
      }
      .tab:hover { color: var(--rw-fg); }
      .tab.active { color: var(--rw-accent); border-bottom-color: var(--rw-accent); font-weight: 500; }
      .tab .num { margin-left: 4px; color: var(--rw-fg-subtle); font-size: 12px; }
      .modal-mask { background: rgba(15, 23, 42, 0.45); }
      .modal {
        background: var(--rw-card); border-radius: var(--radius-lg); box-shadow: var(--rw-shadow-float);
        border: 1px solid var(--rw-border);
      }
      .input {
        background: var(--rw-card); border: 1px solid var(--rw-border-strong); border-radius: var(--radius-sm);
        height: 32px; padding: 0 12px; font-size: 14px; color: var(--rw-fg); width: 100%;
        transition: all 140ms var(--ease-out); outline: none;
      }
      .input:focus { border-color: var(--rw-accent); box-shadow: 0 0 0 3px var(--rw-ring); }
      .avatar {
        width: 38px; height: 38px; border-radius: var(--radius-sm); background: var(--rw-accent-subtle);
        color: var(--rw-accent); display: flex; align-items: center; justify-content: center;
        font-size: 14px; font-weight: 500; flex-shrink: 0;
      }
    <main class="mx-auto max-w-[1080px] px-8 py-8 space-y-10">

      <section>
        <div class="mb-4 flex items-center gap-3">
          <span class="section-tag">A</span>
          <h2 class="font-display text-[15px] font-semibold">技能列表（/skills 新导航「技能」）+ 新建/编辑弹窗（PROMPT 模板）</h2>
        </div>
        <div class="mb-4 flex items-end justify-between">
          <div>
            <h3 class="font-display text-2xl font-semibold tracking-tight text-rw-fg">技能</h3>
            <p class="mt-1 text-sm text-rw-fg-subtle">提示词技能（Markdown/模板）——绑定给数字员工即可复用</p>
          </div>
          <button class="btn-primary" data-testid="skill-create-btn">＋ 新建技能</button>
        </div>
        <div class="grid grid-cols-2 gap-4">
          <div class="rw-card rw-hover p-5">
            <div class="mb-2 flex items-center justify-between">
              <span class="font-display text-[15px] font-semibold">周报生成</span>
              <span class="pill pill-success" style="animation:none"><span class="pill-dot" style="animation:none"></span>PROMPT</span>
            </div>
            <p class="text-[13px] text-rw-fg-muted">按「进展/风险/下周计划」三段生成周报初稿</p>
            <p class="mt-3 flex items-center justify-between border-t border-rw-border pt-3 text-xs text-rw-fg-subtle tabular-nums"><span>v3</span><span>绑定 2 名员工</span></p>
          </div>
          <div class="rw-card p-5">
            <div class="mb-2 flex items-center justify-between">
              <span class="font-display text-[15px] font-semibold">会议纪要提炼</span>
              <span class="pill pill-success" style="animation:none"><span class="pill-dot" style="animation:none"></span>PROMPT</span>
            </div>
            <p class="text-[13px] text-rw-fg-muted">从原始记录提炼决议/待办/责任人</p>
            <p class="mt-3 flex items-center justify-between border-t border-rw-border pt-3 text-xs text-rw-fg-subtle tabular-nums"><span>v1</span><span>未绑定</span></p>
          </div>
        </div>
      </section>

      <section>
        <div class="mb-4 flex items-center gap-3"><span class="section-tag">B</span>
          <h2 class="font-display text-[15px] font-semibold">编辑弹窗：模板正文（promptTemplate, mono 编辑区）</h2></div>
        <div class="rw-card p-6 space-y-4">
          <div class="grid grid-cols-2 gap-4">
            <div><label class="mb-1.5 block text-xs text-rw-fg-muted">名称</label><input class="input" value="周报生成" /></div>
            <div><label class="mb-1.5 block text-xs text-rw-fg-muted">类型</label>
              <select class="input"><option selected>PROMPT（提示词模板）</option><option disabled>SOP（状态机,S4+ 启用）</option></select></div>
          </div>
          <div><label class="mb-1.5 block text-xs text-rw-fg-muted">简介</label><input class="input" value="按三段生成周报初稿" /></div>
          <div><label class="mb-1.5 block text-xs text-rw-fg-muted">模板正文（System 段追加）</label>
            <textarea class="input !h-auto p-3 font-mono text-[13px]" rows="5">你将收到一周的工作记录,按以下三段输出周报：
一、本周进展（要点式,量化优先）
二、风险与阻塞（标注需谁决策）
三、下周计划（负责人+截止）</textarea></div>
          <p class="text-xs text-rw-fg-subtle">SOP 类型随 SKILL-002（状态机编排）启用——选项置灰展示去向。</p>
        </div>
      </section>

    </main>
  </body>
</html>
