name: rabbitwork

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: rabbitwork
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d rabbitwork"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  # MinIO 当前代码未使用：默认不启动（profiles 隔离），对象存储接入时启用
  minio:
    profiles: ["full"]
    image: quay.io/minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 20

  migrator:
    build:
      context: ..
      dockerfile: Dockerfile
      target: toolbox
    environment: &appenv
      DATABASE_URL: postgresql://postgres:postgres@db:5432/rabbitwork
      REDIS_URL: redis://redis:6379
      WEB_URL: http://web:3000
      SESSION_SECRET: change-me-in-prod-32chars-secret!
      INTERNAL_TOKEN: change-me-internal-token
    command:
      ["sh", "-c", "pnpm --filter @rabbit/db migrate-deploy && pnpm --filter @rabbit/db seed"]
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: ..
      dockerfile: Dockerfile
      target: web
    environment: *appenv
    ports:
      - "3600:3000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully

volumes:
  pgdata:
  miniodata:
