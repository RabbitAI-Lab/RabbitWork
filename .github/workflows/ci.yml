name: ci

# 触发面（RabbitAITest 2026-10-02 优化先例：PR-only——merge 后 main 不再重跑）：
# 仅 pull_request 触发 + workflow_dispatch 手动兜底。合并前验证不可省；同代码 merge 到 main
# 再跑一轮属纯重复。main 需开分支保护（required checks 认下方 ci-gate 锚点 + strict up-to-date）。
# docs-only 直通语义放在 job 级 if——workflow 级 paths-ignore 被跳过时必需检查永远「expected」
# 卡死合并（RabbitAITest PR#46 实证），job 级 skipped 会被保护规则视为通过（GitHub 官方口径）。
on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# GITHUB_TOKEN 最小权限（rules/security §5.3）：所有 job 只需读仓库内容
permissions:
  contents: read

jobs:
  # 变更面探测（恒跑）：code=true（含代码/配置变更）→ 下游全量执行；纯 docs/md → 下游全部
  # job 级 skipped（保护规则视为通过，直通合并）。workflow_dispatch 恒全量。
  changes:
    name: 变更面探测（docs-only 直通）
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - id: filter
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          BASE="${{ github.event.pull_request.base.sha }}"
          HEAD="${{ github.event.pull_request.head.sha }}"
          MB=$(git merge-base "$BASE" "$HEAD" 2>/dev/null || echo "$BASE")
          if git diff --name-only "$MB" "$HEAD" | grep -Ev '(^docs/|\.md$|^CHANGELOG\.md$|^\.oxfmtignore$)' | grep -q .; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  quality:
    name: lint + typecheck + unit + 边界 + 审计
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @rabbit/db generate
      - run: pnpm lint
      - run: pnpm typecheck
      # 含 node --test scripts/（rabbit-env 端口表唯一性与跨项目零交叠守护）
      - run: pnpm test
      - name: 模块边界静态检查（dependency-graph §4）
        run: node scripts/check-boundaries.mjs
      - name: 依赖审计（high+ 阻塞；豁免须登记 docs/security/audit-waivers.md）
        run: pnpm audit --prod --audit-level high

  build:
    name: next build
    runs-on: ubuntu-latest
    needs: [changes, quality]
    if: needs.changes.outputs.code == 'true'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @rabbit/db generate
      - run: pnpm --filter web build

  migrate-replay:
    name: 空库全量迁移重放
    runs-on: ubuntu-latest
    needs: quality
    if: needs.changes.outputs.code == 'true'
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: rabbitwork_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 3s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: 20 }
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @rabbit/db generate
      - name: migrate deploy + diff + seed 幂等
        run: |
          export DATABASE_URL=postgresql://postgres:postgres@localhost:5432/rabbitwork_ci
          pnpm --filter @rabbit/db migrate-deploy
          pnpm --filter @rabbit/db exec prisma migrate diff --from-schema-datamodel prisma/schema.prisma --to-url $DATABASE_URL --exit-code && echo "schema in sync"
          pnpm --filter @rabbit/db seed
          pnpm --filter @rabbit/db seed  # 幂等重跑（rules/database §6.5）

  e2e:
    name: Playwright E2E（三类断言）
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.code == 'true'
    # 不 needs build：e2e 自带 web 构建（global-setup 缺失时补构建）从 t=0 并行起跑——
    # build 是并行「构建门禁」而非前置依赖（RabbitAITest INFRA-011 先例）
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: rabbitwork_e2e
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 3s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6391:6391"]
        options: >-
          --health-cmd "redis-cli -p 6391 ping" --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      # global-setup 检测到 E2E_DATABASE_URL 即复用 service 库（跳过 embedded PG）
      E2E_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/rabbitwork_e2e
      E2E_REDIS_URL: redis://127.0.0.1:6391/0
      CI: "true"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: 20 }
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @rabbit/db generate
      - name: cache next build（.next/cache 增量构建；首轮 miss=全量构建不劣化）
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: apps/web/.next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('apps/web/src/**/*.ts', 'apps/web/src/**/*.tsx', 'apps/web/next.config.ts') }}
          restore-keys: nextjs-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
      - run: pnpm --filter web build
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/rabbitwork_e2e
      - run: pnpm exec playwright install --with-deps chromium
      - name: run e2e（含每用例自动截屏）
        run: pnpm test:e2e
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 30
          if-no-files-found: ignore

  # JMeter api-test 作业随首个 tests/api/*.jmx 加入（分片口径 rules/testing §2.5，先例 RabbitAITest ci.yml）

  # 门禁锚点（分支保护必需检查的恒定名锚）：聚合全部上游结果——failure/cancelled 即红，
  # skipped（docs-only 直通）视为通过。矩阵作业在被跳过时只报单个无后缀名、与带分片后缀的
  # 必需上下文永不匹配（RabbitAITest PR#46 实证）——必需检查改认本锚点即兼容两态。
  ci-gate:
    name: ci 门禁（必需检查锚点）
    needs: [changes, quality, build, migrate-replay, e2e]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: 汇聚判定（failure/cancelled 即红；skipped 直通）
        run: |
          echo '${{ toJSON(needs) }}' | jq -e 'to_entries | map(select(.value.result == "failure" or .value.result == "cancelled")) | length == 0' \
            || { echo "上游作业存在 failure/cancelled"; exit 1; }
          echo "ci 门禁通过（全部上游 success/skipped）"
